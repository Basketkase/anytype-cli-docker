services:
  anytype:
    image: ghcr.io/basketkase/anytype-cli-docker:main
    volumes:
      - anytype-data:/data
    environment:
      OPENAPI_MCP_HEADERS: ${OPENAPI_MCP_HEADERS:?Set the Anytype API key header}
      MCPO_API_KEY: ${MCPO_API_KEY:?Set the MCP proxy API key}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  anytype-data:
