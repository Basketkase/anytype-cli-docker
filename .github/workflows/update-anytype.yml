name: Update Anytype

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          anytype_version=$(curl --fail-with-body --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/anyproto/anytype-cli/releases/latest | jq --raw-output .tag_name)
          [[ "$anytype_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          sed -i "s/^ARG ANYTYPE_VERSION=.*/ARG ANYTYPE_VERSION=$anytype_version/" Dockerfile

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-anytype
          commit-message: 'chore: update Anytype dependencies'
          title: 'chore: update Anytype dependencies'
          body: |
            Updates Anytype CLI to its latest upstream release.
          delete-branch: true
